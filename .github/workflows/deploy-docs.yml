name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build docs image
        run: docker build -t docs-builder .

      - name: Read target version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Configure git identity for mike
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$PWD"

      - name: Deploy version to gh-pages
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/docs -v "$HOME/.gitconfig":/etc/gitconfig:ro \
            docs-builder mike deploy --push --update-aliases "${{ steps.version.outputs.version }}" latest

      - name: Set default version
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/docs -v "$HOME/.gitconfig":/etc/gitconfig:ro \
            docs-builder mike set-default --push latest
