services:
  docs:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/docs
    ports:
      - "8000:8000"
    command: ["zensical", "serve", "--dev-addr", "0.0.0.0:8000"]

  docs-build:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/docs
    command: ["zensical", "build"]
    profiles: ["build"]

  # Runs mike (git+github.com/squidfunk/mike, the Zensical-compatible fork)
  # for versioned deploys, e.g.:
  #   docker compose run --rm docs-version mike deploy --push --update-aliases 2 latest
  #   docker compose run --rm docs-version mike set-default --push latest
  #   docker compose run --rm docs-version mike list
  docs-version:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/docs
      - ${HOME}/.gitconfig:/etc/gitconfig:ro
    profiles: ["version"]
